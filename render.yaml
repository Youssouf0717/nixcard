services:
  - type: web
    name: nixcard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nixcard-db
          property: connectionString
      - key: BASE_URL
        sync: false

databases:
  - name: nixcard-db
    plan: free
