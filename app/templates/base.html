<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Nixcard{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="nav">
  <a class="brand" href="{{ url_for('public.home') }}">
    <img src="{{ url_for('static', filename='nixcard.png') }}" alt="Nixcard">
    Nix<span>card</span>
  </a>
  <div class="nav-links">
    {% if current_user.is_authenticated %}
      <a href="{{ url_for('dashboard.index') }}">Tableau de bord</a>
      <a href="{{ url_for('auth.logout') }}">Déconnexion</a>
    {% else %}
      <a href="{{ url_for('auth.login') }}">Connexion</a>
      <a class="btn btn-primary" href="{{ url_for('auth.register') }}">S'inscrire</a>
    {% endif %}
  </div>
</nav>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash flash-{{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
