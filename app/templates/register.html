{% extends "base.html" %}
{% block title %}Inscription — Nixcard{% endblock %}
{% block content %}
<div class="card-panel" style="max-width:400px;margin:40px auto">
  <h2 style="margin-bottom:20px">Créer un compte</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" autocomplete="email" required autofocus>
    </label>
    <label>Mot de passe
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      <span style="font-size:.78rem;color:#4b5563;margin-top:4px;display:block">
        8 caractères minimum · 1 majuscule · 1 chiffre
      </span>
    </label>
    <div style="margin-top:8px">
      <button class="btn btn-primary" style="width:100%" type="submit">Créer mon compte</button>
    </div>
  </form>
  <p class="muted" style="margin-top:16px;text-align:center">
    Déjà un compte ? <a href="{{ url_for('auth.login') }}">Se connecter</a>
  </p>
</div>
{% endblock %}
